services:
  - type: web
    name: usdt-naira-exchange
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: usdt-naira-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: usdt-naira-db
    plan: free
