<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>USDT/Naira Admin</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f7fb;color:#172033}
.wrap{max-width:1000px;margin:auto;padding:20px}
.card{background:#fff;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #0001}
input,select,button{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border:1px solid #ccd3df;border-radius:8px}
button{background:#172033;color:#fff;border:0;cursor:pointer;font-weight:700}
button:hover{opacity:.9}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
table{width:100%;border-collapse:collapse;display:block;overflow:auto}
th,td{padding:9px;border-bottom:1px solid #e5e8ee;text-align:left;white-space:nowrap}
.msg{padding:10px;border-radius:8px;background:#eef3ff;margin:8px 0}
.hidden{display:none}
h1{margin-top:0}
</style>
</head>
<body>
<div class="wrap">
<h1>USDT/Naira Admin</h1>
<div id="login" class="card">
<h2>Admin Login</h2>
<input id="password" type="password" placeholder="Admin password" autocomplete="current-password">
<button onclick="login()">Login</button>
<div id="loginMsg"></div>
</div>

<div id="panel" class="hidden">
<div class="card">
<h2>Exchange & Payment Settings</h2>
<div class="grid">
<label>Rate (₦ per USDT)<input id="rate" type="number" step="0.01"></label>
<label>Bank name<input id="bankName"></label>
<label>Account name<input id="accountName"></label>
<label>Account number<input id="accountNumber"></label>
<label>USDT network<input id="network" placeholder="TRC20"></label>
</div>
<button onclick="saveSettings()">Save Settings</button>
<div id="settingsMsg"></div>
</div>

<div class="card">
<h2>Orders</h2>
<button onclick="loadOrders()">Refresh Orders</button>
<div id="ordersMsg"></div>
<div id="orders"></div>
</div>
</div>
</div>
<script>
let adminPassword = "";
async function api(url, opts={}) {
  opts.headers = Object.assign({}, opts.headers||{}, {"x-admin-password":adminPassword,"Content-Type":"application/json"});
  const r = await fetch(url, opts);
  let data={}; try{data=await r.json()}catch(e){}
  if(!r.ok) throw new Error(data.error || "Request failed");
  return data;
}
async function login(){
  adminPassword=document.getElementById("password").value;
  try{
    await api("/api/admin/settings");
    document.getElementById("login").classList.add("hidden");
    document.getElementById("panel").classList.remove("hidden");
    await loadSettings(); await loadOrders();
  }catch(e){
    document.getElementById("loginMsg").textContent=e.message;
    adminPassword="";
  }
}
async function loadSettings(){
  const s=await api("/api/admin/settings");
  rate.value=s.rate; bankName.value=s.bank_name; accountName.value=s.account_name;
  accountNumber.value=s.account_number; network.value=s.network;
}
async function saveSettings(){
  try{
    await api("/api/admin/settings",{method:"PUT",body:JSON.stringify({
      rate:Number(rate.value),bankName:bankName.value,accountName:accountName.value,
      accountNumber:accountNumber.value,network:network.value
    })});
    settingsMsg.textContent="Settings saved.";
    await loadOrders();
  }catch(e){settingsMsg.textContent=e.message}
}
async function loadOrders(){
  try{
    const list=await api("/api/admin/orders");
    if(!list.length){orders.innerHTML="<p>No orders yet.</p>";return}
    let h="<table><thead><tr><th>Ref</th><th>Naira</th><th>USDT</th><th>Wallet</th><th>Rate</th><th>Status</th><th>Created</th><th>Action</th></tr></thead><tbody>";
    for(const o of list){
      h+=`<tr><td>${esc(o.order_ref)}</td><td>₦${Number(o.naira_amount).toLocaleString()}</td><td>${esc(o.usdt_amount)}</td><td>${esc(o.wallet_address)}</td><td>₦${esc(o.rate)}</td><td>${esc(o.status)}</td><td>${esc(new Date(o.created_at).toLocaleString())}</td><td>
      <select id="st-${o.id}">
      ${["Awaiting Payment","Payment Received","USDT Sent","Completed","Cancelled"].map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}
      </select><button onclick="updateStatus(${o.id})">Update</button></td></tr>`;
    }
    h+="</tbody></table>"; orders.innerHTML=h;
  }catch(e){ordersMsg.textContent=e.message}
}
async function updateStatus(id){
  try{
    const status=document.getElementById("st-"+id).value;
    await api("/api/admin/orders/"+id,{method:"PATCH",body:JSON.stringify({status})});
    await loadOrders();
  }catch(e){alert(e.message)}
}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
</script>
</body>
</html>
